<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15120f">
    <title>Mochi Pager V1</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="prototype">
      <section
        id="screen"
        class="pager-screen"
        data-session="inactive"
        data-input="gated"
        data-output="idle"
        data-face-activity="idle"
        data-expression="curious"
        data-mood="curious"
        data-energy="normal"
        data-charging="false"
        data-rest-gaze="up"
        data-gaze-motion="up"
        data-roll-direction="none"
        aria-label="Mochi Pager screen simulator"
      >
        <header class="status-row">
          <span id="indicator" class="indicator" data-color="off" aria-hidden="true"></span>
          <span id="status" class="status-text">Private · not listening</span>
          <span id="battery-status" class="visually-hidden" role="status" aria-live="polite">Battery normal</span>
        </header>

        <div class="face" aria-hidden="true">
          <div class="listening-halo"></div>
          <div class="eye-rig eye-left"><div class="eye"><span class="pupil"></span></div></div>
          <div class="eye-rig eye-right"><div class="eye"><span class="pupil"></span></div></div>
        </div>

        <div id="caption-viewport" class="caption-viewport" aria-live="polite" aria-label="Assistant caption">
          <span id="caption" class="caption" data-motion="idle"></span>
        </div>
      </section>

      <button id="conversation-button" class="conversation-button" type="button">
        Start listening
      </button>
      <p class="prototype-note">V1-A simulator · this one button stands in for the future physical conversation button.</p>
      <audio id="remote-audio" autoplay playsinline></audio>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
